spring.application.name=nerdy-logs-app

# Base configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/nerdy_logs_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=test
logging.level.org.hibernate.persister.entity=ERROR

# Default user
users.defaultUser.username=testuser
users.defaultUser.email=testuser@nerdylogs.com
users.defaultUser.password=test1234
users.defaultUser.profilePicture=/images/default-pfp.jpg