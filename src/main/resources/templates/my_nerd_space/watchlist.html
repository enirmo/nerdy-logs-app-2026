<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Library | Nerdy Logs</title>
    <link rel="stylesheet" th:href="@{/css/library-style.css}">
</head>
<body>

<header class="top-navbar">
    <a href="/" class="logo-link">
        <img src="/images/logo.png" alt="Nerdy Logs Logo">
    </a>

    <nav class="category-tabs">
        <a href="#movies">Movies</a>
        <a href="#series">Series</a>
        <a href="#games">Games</a>
        <a href="#anime">Anime</a>
        <a href="#books">Books</a>
    </nav>
</header>

<aside class="sidebar">
    <div class="profile">
        <img src="/images/default-profile.png" alt="Profile picture">
        <a href="/profile" class="username">Username</a>
    </div>

    <nav class="side-tabs">
        <a href="/library" class="active">Watchlist</a>
        <a href="/library/watched">Completed</a>
        <a href="/library/in-progress">In Progress</a>
        <a href="/library/dropped">Dropped</a>
    </nav>
</aside>

<main class="library-content">

    <section class="library-tools">
        <input type="text" placeholder="Search your library..." class="search-input">

        <select class="filter-select">
            <option value="">All categories</option>
            <option value="movies">Movies</option>
            <option value="series">Series</option>
            <option value="games">Games</option>
            <option value="anime">Anime</option>
            <option value="books">Books</option>
        </select>

        <select class="filter-select">
            <option value="">Genre</option>
            <option value="crime">Crime</option>
            <option value="thriller">Thriller</option>
            <option value="horror">Horror</option>
            <option value="comedy">Comedy</option>
            <option value="action">Action</option>
            <option value="romance">Romance</option>
            <option value="fantasy">Fantasy</option>
            <option value="other">Other</option>
        </select>
    </section>


    <section class="library-section" id="movies">
        <h2>Movies</h2>

        <div class="card-row">
            <article class="entry-card">
                <img src="/images/placeholders/movie.jpg" alt="Movie poster">
                <div class="entry-info">
                    <h3>Movie Title</h3>
                    <p>2024 · Fantasy</p>
                </div>
            </article>

            <article class="entry-card">
                <img src="/images/placeholders/movie.jpg" alt="Movie poster">
                <div class="entry-info">
                    <h3>Another Movie</h3>
                    <p>2022 · Drama</p>
                </div>
            </article>
        </div>
    </section>

    <section class="library-section" id="series">
        <h2>Series</h2>

        <div class="card-row">
            <article class="entry-card">
                <img src="/images/placeholders/series.jpg" alt="Series poster">
                <div class="entry-info">
                    <h3>Series Title</h3>
                    <p>3 Seasons</p>
                </div>
            </article>
        </div>
    </section>

    <section class="library-section" id="games">
        <h2>Games</h2>

        <div class="card-row">
            <article class="entry-card">
                <img src="/images/placeholders/game.jpg" alt="Game cover">
                <div class="entry-info">
                    <h3>Game Title</h3>
                    <p>RPG · PC</p>
                </div>
            </article>
        </div>
    </section>

    <section class="library-section" id="anime">
        <h2>Anime</h2>

        <div class="card-row">
            <article class="entry-card">
                <img src="/images/placeholders/anime.jpg" alt="Anime poster">
                <div class="entry-info">
                    <h3>Anime Title</h3>
                    <p>24 Episodes</p>
                </div>
            </article>
        </div>
    </section>

    <section class="library-section" id="books">
        <h2>Books</h2>

        <div class="card-row">
            <article class="entry-card">
                <img src="/images/placeholders/book.jpg" alt="Book cover">
                <div class="entry-info">
                    <h3>Book Title</h3>
                    <p>Author Name</p>
                </div>
            </article>
        </div>
    </section>

</main>

</body>
</html>
