<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Library | Nerdy Logs</title>
    <link rel="stylesheet" th:href="@{/css/library-style.css}">
</head>
<body>

<header class="top-navbar">
    <a href="/" class="logo-link">
        <img src="/images/logo.png" alt="Nerdy Logs Logo">
    </a>


    <nav class="category-tabs">

        <div class="dropdown">

            <button class="dropdown-btn">
                Catalog ▾
            </button>

            <div class="dropdown-content">
                <a href="/movies">Movies</a>
                <a href="/series">Series</a>
                <a href="/games">Games</a>
                <a href="/anime">Anime</a>
                <a href="/books">Books</a>
            </div>

        </div>

        <a href="/logout">Logout</a>

    </nav>
</header>

<aside class="sidebar">
    <div class="profile">
        <img th:src="${user.profilePicture != null ? user.profilePicture : '/images/default-pfp.png'}"
             alt="Profile picture">

        <a href="/profile"
           class="username"
           th:text="${user.username}">
            Username
        </a>
    </div>

    <nav class="side-tabs">
        <a href="/watchlist"
           th:classappend="${activePage == 'watchlist'} ? ' active'">
            Watchlist
        </a>

        <a href="/completed"
           th:classappend="${activePage == 'completed'} ? ' active'">
            Completed
        </a>

        <a href="/in-progress"
           th:classappend="${activePage == 'in-progress'} ? ' active'">
            In Progress
        </a>

        <a href="/dropped"
           th:classappend="${activePage == 'dropped'} ? ' active'">
            Dropped
        </a>
    </nav>
</aside>

<main class="library-content">

    <section class="library-tools">
        <form method="get" th:action="@{${currentPath}}" class="search-form">
            <input type="text"
                   name="search"
                   placeholder="Search your list..."
                   class="search-input"
                   th:value="${search}">
        </form>

        <select class="filter-select">
            <option value="">All categories</option>
            <option value="movies">Movies</option>
            <option value="series">Series</option>
            <option value="games">Games</option>
            <option value="anime">Anime</option>
            <option value="books">Books</option>
        </select>

        <select class="filter-select">
            <option value="">Genre</option>
            <option value="crime">Crime</option>
            <option value="thriller">Thriller</option>
            <option value="horror">Horror</option>
            <option value="comedy">Comedy</option>
            <option value="action">Action</option>
            <option value="romance">Romance</option>
            <option value="fantasy">Fantasy</option>
            <option value="other">Other</option>
        </select>
    </section>


    <section class="library-section" id="movies">
        <h2>Movies</h2>

        <div class="card-row">
            <article class="entry-card" th:each="entry : ${movies}">
                <img th:src="${entry.item.pictureCover}" alt="Movie poster">

                <div class="entry-info">
                    <h3 th:text="${entry.item.name}">Movie Title</h3>

                    <p>
                        <span th:text="${entry.item.releaseYear}">2024</span>
                        <span th:text="${entry.item.genre}">Fantasy</span>
                    </p>

                    <form th:action="@{/reviews/add}" method="post" class="review-form">

                        <input type="hidden" name="mediaId" th:value="${entry.item.id}">
                        <input type="hidden" name="redirectTo" th:value="${currentPath}">

                        <div class="review-rating-row">
                            <label>Your rating</label>

                            <input type="number"
                                   name="rating"
                                   min="1"
                                   max="10"
                                   placeholder="1-10"
                                   required>
                        </div>

                        <label class="review-comment-label">
                            Comment
                            <textarea name="comment"
                                      maxlength="350"
                                      placeholder="What did you think?"></textarea>
                        </label>

                        <button type="submit" class="review-btn">
                            Add Review
                        </button>

                    </form>

                </div>
            </article>
        </div>
    </section>

    <section class="library-section" id="series">
        <h2>Series</h2>

        <div class="card-row">
            <article class="entry-card" th:each="entry : ${series}">
                <img th:src="${entry.item.pictureCover}" alt="Series poster">

                <div class="entry-info">
                    <h3 th:text="${entry.item.name}">Series Title</h3>

                    <p>
                        <span th:text="${entry.item.releaseYear}">2024</span>
                        <span th:text="${entry.item.genre}">Drama</span>
                    </p>


                    <form th:action="@{/reviews/add}" method="post" class="review-form">

                        <input type="hidden"
                               name="mediaId"
                               th:value="${entry.item.id}">

                        <input type="hidden"
                               name="redirectTo"
                               th:value="${currentPath}">

                        <div class="review-rating-row">
                            <label>Your rating</label>

                            <input type="number"
                                   name="rating"
                                   min="1"
                                   max="10"
                                   placeholder="1-10"
                                   required>
                        </div>

                        <label class="review-comment-label">
                            Comment

                            <textarea name="comment"
                                      maxlength="350"
                                      placeholder="What did you think?"></textarea>
                        </label>

                        <button type="submit" class="review-btn">
                            Add Review
                        </button>

                    </form>
                    
                </div>


            </article>
        </div>
    </section>

    <section class="library-section" id="games">
        <h2>Games</h2>

        <div class="card-row">
            <article class="entry-card" th:each="entry : ${games}">
                <img th:src="${entry.item.pictureCover}" alt="Game cover">

                <div class="entry-info">
                    <h3 th:text="${entry.item.name}">Game Title</h3>

                    <p>
                        <span th:text="${entry.item.releaseYear}">2024</span>
                        <span th:text="${entry.item.genre}">RPG</span>
                    </p>

                    <form th:action="@{/reviews/add}" method="post" class="review-form">

                        <input type="hidden"
                               name="mediaId"
                               th:value="${entry.item.id}">

                        <input type="hidden"
                               name="redirectTo"
                               th:value="${currentPath}">

                        <div class="review-rating-row">
                            <label>Your rating</label>

                            <input type="number"
                                   name="rating"
                                   min="1"
                                   max="10"
                                   placeholder="1-10"
                                   required>
                        </div>

                        <label class="review-comment-label">
                            Comment

                            <textarea name="comment"
                                      maxlength="350"
                                      placeholder="What did you think?"></textarea>
                        </label>

                        <button type="submit" class="review-btn">
                            Add Review
                        </button>

                    </form>

                </div>

            </article>
        </div>
    </section>

    <section class="library-section" id="anime">
        <h2>Anime</h2>

        <div class="card-row">
            <article class="entry-card" th:each="entry : ${anime}">
                <img th:src="${entry.item.pictureCover}" alt="Anime poster">

                <div class="entry-info">
                    <h3 th:text="${entry.item.name}">Anime Title</h3>

                    <p>
                        <span th:text="${entry.item.releaseYear}">2024</span>
                        <span th:text="${entry.item.genre}">Action</span>
                    </p>

                    <form th:action="@{/reviews/add}" method="post" class="review-form">

                        <input type="hidden"
                               name="mediaId"
                               th:value="${entry.item.id}">

                        <input type="hidden"
                               name="redirectTo"
                               th:value="${currentPath}">

                        <div class="review-rating-row">
                            <label>Your rating</label>

                            <input type="number"
                                   name="rating"
                                   min="1"
                                   max="10"
                                   placeholder="1-10"
                                   required>
                        </div>

                        <label class="review-comment-label">
                            Comment

                            <textarea name="comment"
                                      maxlength="350"
                                      placeholder="What did you think?"></textarea>
                        </label>

                        <button type="submit" class="review-btn">
                            Add Review
                        </button>

                    </form>

                </div>

            </article>
        </div>
    </section>

    <section class="library-section" id="books">
        <h2>Books</h2>

        <div class="card-row">
            <article class="entry-card" th:each="entry : ${books}">
                <img th:src="${entry.item.pictureCover}" alt="Book cover">

                <div class="entry-info">
                    <h3 th:text="${entry.item.name}">Book Title</h3>

                    <p>
                        <span th:text="${entry.item.releaseYear}">2024</span>
                        <span th:text="${entry.item.genre}">Fantasy</span>
                    </p>

                    <form th:action="@{/reviews/add}" method="post" class="review-form">

                        <input type="hidden"
                               name="mediaId"
                               th:value="${entry.item.id}">

                        <input type="hidden"
                               name="redirectTo"
                               th:value="${currentPath}">

                        <div class="review-rating-row">
                            <label>Your rating</label>

                            <input type="number"
                                   name="rating"
                                   min="1"
                                   max="10"
                                   placeholder="1-10"
                                   required>
                        </div>

                        <label class="review-comment-label">
                            Comment

                            <textarea name="comment"
                                      maxlength="350"
                                      placeholder="What did you think?"></textarea>
                        </label>

                        <button type="submit" class="review-btn">
                            Add Review
                        </button>

                    </form>

                </div>

            </article>
        </div>
    </section>

</main>

</body>
</html>
