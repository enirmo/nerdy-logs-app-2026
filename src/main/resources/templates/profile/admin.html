<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Nerdy Logs</title>

    <link rel="stylesheet" href="/css/library-style.css">
    <link rel="stylesheet" href="/css/admin-style.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>

<header class="top-navbar">
    <a href="/" class="logo-link">
        <img src="/images/logo.png" alt="Nerdy Logs Logo">
    </a>

    <nav class="category-tabs">
        <div class="dropdown">
            <button class="dropdown-btn">
                Catalog ▾
            </button>

            <div class="dropdown-content">
                <a href="/movies">Movies</a>
                <a href="/series">Series</a>
                <a href="/games">Games</a>
                <a href="/anime">Anime</a>
                <a href="/books">Books</a>
            </div>
        </div>


        <a href="/admin/changelog">Admin changelog</a>

        <form th:action="@{/logout}"
              method="post"
              class="logout-form">

            <button type="submit"
                    class="logout-btn">
                Logout
            </button>

        </form>
    </nav>
</header>

<main class="admin-content">

    <section class="admin-header">
        <h1>Admin Panel</h1>
    </section>

    <!--/*@thymesVar id="errorMessage" type="java.lang.String"*/-->
    <div class="page-message error-message"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <section class="admin-section">
        <div class="section-title">
            <h2>Catalog Management</h2>
            <a href="/admin/items/add" class="admin-btn primary">+ Add Item</a>
        </div>

        <section class="add-item-panel" th:if="${showAddForm}">
            <div class="add-item-header">
                <h3>Add New Item</h3>
                <a href="/admin" class="small-btn cancel">Cancel</a>
            </div>

            <form th:action="@{/admin/items/add}"
                  th:object="${itemRequest}"
                  method="post"
                  class="add-item-form">

                <div class="form-row">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" th:field="*{itemName}">

                        <p class="field-error"
                           th:if="${#fields.hasErrors('itemName')}"
                           th:errors="*{itemName}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Release Year</label>
                        <input type="number" th:field="*{releaseYear}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Medium</label>
                        <select th:field="*{medium}">
                            <option value="">Select medium</option>
                            <option th:each="medium : ${mediums}"
                                    th:value="${medium}"
                                    th:text="${medium}">
                            </option>
                        </select>

                        <p class="field-error"
                           th:if="${#fields.hasErrors('medium')}"
                           th:errors="*{medium}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Genre</label>
                        <select th:field="*{genre}">
                            <option value="">Select genre</option>
                            <option th:each="genre : ${genres}"
                                    th:value="${genre}"
                                    th:text="${genre}">
                            </option>
                        </select>

                        <p class="field-error"
                           th:if="${#fields.hasErrors('genre')}"
                           th:errors="*{genre}">
                        </p>
                    </div>
                </div>

                <div class="form-group">
                    <label>Cover Image URL</label>
                    <input type="text" th:field="*{pictureCover}">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="admin-btn primary">Save Item</button>
                </div>
            </form>
        </section>

        <div class="admin-tools">
            <form method="get" th:action="@{/admin}" class="admin-tools">
                <input type="text"
                       name="itemSearch"
                       placeholder="Search catalog..."
                       class="admin-input"
                       th:value="${itemSearch}">

                <a href="/admin/items/all" class="admin-btn">See More</a>
            </form>

            <select class="admin-select">
                <option>All Categories</option>
                <option>Movies</option>
                <option>Series</option>
                <option>Games</option>
                <option>Anime</option>
                <option>Books</option>
            </select>
        </div>

        <div class="admin-table">
            <div class="table-row table-head">
                <span>Title</span>
                <span>Category</span>
                <span>Genre</span>
                <span>Actions</span>
            </div>

            <div class="table-row" th:each="item : ${items}">

                <a th:href="@{/admin/catalog/{id}(id=${item.id})}"
                   th:text="${item.name}"
                   class="item-title">
                    Item Title
                </a>

                <span th:text="${item.mediumType}">Category</span>
                <span th:text="${item.genre}">Genre</span>
                <span class="actions">
                    <a th:href="@{/admin/catalog/{id}/edit(id=${item.id})}" class="small-btn edit">Edit</a>

                    <form th:action="@{/admin/items/{id}/delete(id=${item.id})}"
                          method="post"
                          style="display:inline;">

                        <button type="submit" class="small-btn danger">
                            Delete
                         </button>
                    </form>
                </span>

                <div th:if="${#lists.isEmpty(items)}" class="empty-state">
                    No catalog items found.
                </div>

            </div>
        </div>
    </section>

    <section class="admin-section">
        <div class="section-title">
            <h2>User Search</h2>
        </div>

        <div class="admin-tools">
            <form method="get" th:action="@{/admin}" class="search-form">
                <input type="text"
                       name="userSearch"
                       placeholder="Search users..."
                       class="admin-input"
                       th:value="${userSearch}">
            </form>
        </div>

        <div class="user-results">
            <article class="user-card" th:each="user : ${users}">

                <img th:src="${user.profilePicture}"
                     src="/images/default-pfp.jpg"
                     alt="User profile">

                <div>
                    <h3 th:text="${user.username}">Username</h3>
                    <p th:text="'@' + ${user.username}">@username</p>

                </div>

                <div th:if="${#lists.isEmpty(users)}" class="empty-state">
                    No users found.
                </div>

                <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                      method="post"
                      style="display:inline;">

                    <button type="submit" class="small-btn danger">
                        Delete
                    </button>
                </form>
            </article>
        </div>
    </section>


</main>

</body>
</html>
