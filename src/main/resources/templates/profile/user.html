<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Profile | Nerdy Logs</title>

  <link rel="stylesheet" href="/css/library-style.css">
  <link rel="stylesheet" href="/css/profile-style.css">
  <link rel="stylesheet" href="/css/error.css">
</head>
<body>

<header class="top-navbar">
  <a href="/" class="logo-link">
    <img src="/images/logo.png" alt="Nerdy Logs Logo">
  </a>

  <nav class="category-tabs">

    <div class="dropdown">

      <button class="dropdown-btn">
        Catalog ▾
      </button>

      <div class="dropdown-content">
        <a href="/movies">Movies</a>
        <a href="/series">Series</a>
        <a href="/games">Games</a>
        <a href="/anime">Anime</a>
        <a href="/books">Books</a>
      </div>

    </div>

    <form th:action="@{/logout}"
          method="post"
          class="logout-form">

      <button type="submit"
              class="logout-btn">
        Logout
      </button>

    </form>

  </nav>
</header>

<aside class="sidebar">
  <div class="profile">
    <img th:src="${user.profilePicture != null ? user.profilePicture : '/images/default-pfp.jpg'}"
         alt="Profile picture">

    <a href="/profile"
       class="username"
       th:text="${user.username}">
      Username
    </a>
  </div>

  <nav class="side-tabs">
    <a href="/watchlist">Watchlist</a>
    <a href="/completed">Completed</a>
    <a href="/in-progress">In Progress</a>
    <a href="/dropped">Dropped</a>
  </nav>
</aside>

<main class="profile-page-content">

  <section class="profile-card">

    <img th:src="${user.profilePicture != null ? user.profilePicture : '/images/default-pfp.jpg'}"
         alt="Profile picture"
         class="profile-card-picture">

    <h1 th:text="${user.username}">Username</h1>

    <p class="profile-email" th:text="${user.email}">
      email@example.com
    </p>

    <form th:action="@{/profile/edit}" method="post" class="profile-edit-form">

      <div class="form-group">
        <label>Profile Picture URL</label>
        <input type="text"
               name="profilePicture"
               th:value="${user.profilePicture}">
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea name="bio"
                  placeholder="Write something about yourself..."
                  th:text="${user.bio}"></textarea>
      </div>

      <button type="submit" class="profile-save-btn">
        Save Changes
      </button>
    </form>

    <form th:action="@{/profile/delete}" method="post" class="delete-profile-form">
      <button type="submit" class="profile-delete-btn">
        Delete Account
      </button>
    </form>

  </section>

</main>

</body>
</html>
