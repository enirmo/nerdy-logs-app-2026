<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' | Nerdy Logs'">Category | Nerdy Logs</title>

    <link rel="stylesheet" href="/css/library-style.css">
    <link rel="stylesheet" href="/css/medium-style.css">
    <link rel="stylesheet" href="/css/error.css">
</head>

<body>

<header class="top-navbar">
    <a href="/" class="logo-link">
        <img src="/images/logo.png" alt="Nerdy Logs Logo">
    </a>

    <nav class="category-tabs">

        <div class="dropdown">

            <button class="dropdown-btn">
                Catalog ▾
            </button>

            <div class="dropdown-content">
                <a href="/movies">Movies</a>
                <a href="/series">Series</a>
                <a href="/games">Games</a>
                <a href="/anime">Anime</a>
                <a href="/books">Books</a>
            </div>

        </div>

        <a th:if="${user.role.name() == 'ADMIN'}"
           href="/admin">
            Admin Panel
        </a>

        <a th:if="${user.role.name() == 'ADMIN'}"
           href="/admin/changelog">
            Admin changelog
        </a>

        <form th:action="@{/logout}"
              method="post"
              class="logout-form">

            <button type="submit"
                    class="logout-btn">
                Logout
            </button>

        </form>

    </nav>
</header>

<aside class="sidebar">
    <div class="profile">
        <img th:src="${user.profilePicture != null ? user.profilePicture : '/images/default-pfp.png'}"
             alt="Profile picture">

        <a href="/profile"
           class="username"
           th:text="${user.username}">
            Username
        </a>
    </div>

    <nav class="side-tabs">
        <a href="/watchlist">Watchlist</a>
        <a href="/completed">Completed</a>
        <a href="/in-progress" >In Progress</a>
        <a href="/dropped">Dropped</a>
    </nav>
</aside>

<main class="category-content">
    <section class="category-header">
        <h1 th:text="${pageTitle}">Movies</h1>
    </section>

    <section class="category-tools">
        <form method="get" th:action="@{${currentPath}}" class="search-form">
            <input type="text"
                   name="search"
                   placeholder="Search this category..."
                   class="search-input"
                   th:value="${search}">
        </form>

        <select class="filter-select">
            <option>All Genres</option>
            <option>Action</option>
            <option>Drama</option>
            <option>Fantasy</option>
            <option>Horror</option>
            <option>RPG</option>
        </select>
    </section>



    <section class="category-grid">

        <article class="entry-card"
                 th:each="item : ${items}">
            <img th:src="${item.pictureCover}" alt="Cover">

            <div class="entry-info">
                <h3 th:text="${item.name}">Item Name</h3>

                <p>
                    <span th:text="${item.releaseYear}">2024</span>
                    ·
                    <span th:text="${item.genre}">Genre</span>
                </p>

                <form th:action="@{/library/add}" method="post" class="add-to-list-form">

                    <!-- Item being added -->
                    <input type="hidden"
                           name="itemId"
                           th:value="${item.id}">

                    <!-- Current page -->
                    <input type="hidden"
                           name="redirectTo"
                           th:value="${currentPath}">

                    <select name="entryStatus" class="list-select">
                        <option value="PLANNED">Watchlist</option>
                        <option value="STARTED">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="DROPPED">Dropped</option>
                    </select>

                    <!--/*@thymesVar id="addedItemId" type=""*/-->
                    <button type="submit"
                            class="add-list-btn"
                            th:if="${(addedItemId == null or !addedItemId.equals(item.id))
                and (errorItemId == null or !errorItemId.equals(item.id))}">
                        Add to My List
                    </button>

                    <button type="button"
                            class="add-list-btn added-success"
                            th:if="${addedItemId != null and addedItemId.equals(item.id)}"
                            disabled>
                        ✓ Added!
                    </button>

                    <button type="button"
                            class="add-list-btn added-error"
                            th:if="${errorItemId != null and errorItemId.equals(item.id)}"
                            disabled>
                        Already in library!
                    </button>

                </form>
            </div>
        </article>

    </section>

    <div th:if="${#lists.isEmpty(items)}" class="empty-state">
        No items found in this category yet.
    </div>

</main>

<script>
    setTimeout(() => {
        document.querySelectorAll(".added-success, .added-error").forEach(button => {
            button.textContent = "Add to My List";
            button.disabled = false;
            button.type = "submit";
            button.classList.remove("added-success", "added-error");
        });
    }, 3000);


    document.querySelectorAll(".add-to-list-form").forEach(form => {
        form.addEventListener("submit", function () {
            sessionStorage.setItem("mediaScrollPosition", window.scrollY);
        });
    });

    window.addEventListener("load", function () {
        const scrollPosition = sessionStorage.getItem("mediaScrollPosition");

        if (scrollPosition !== null) {
            window.scrollTo(0, Number(scrollPosition));
            sessionStorage.removeItem("mediaScrollPosition");
        }
    });
</script>

</body>
</html>
